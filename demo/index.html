<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agri Lanka Trust · Live Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4faf2;--card:#fff;--ink:#17321f;--mute:#5f7a67;--g:#1faa59;--g2:#0e7c3a;--y:#ffb800;--o:#ff7a2f;--t:#00a6a6;--p:#7a4cff;--line:#dcebd9;--shadow:0 10px 30px rgba(20,90,50,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d14;--card:#172a1d;--ink:#e8f6ea;--mute:#9bb8a3;--line:#274130;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0e7c3a;z-index:60}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(90deg,#0e7c3a,#1faa59 55%,#00a6a6);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.logo{font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--y);font-style:normal;animation:sway 3s ease-in-out infinite}.logo i svg{width:24px;height:24px}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.links::-webkit-scrollbar{display:none}
.links a{font-size:11.5px;font-weight:500;padding:6px 9px;border-radius:999px;white-space:nowrap;opacity:.92;transition:.25s}
.links a:hover{background:rgba(255,255,255,.2)}.links a.on{background:#fff;color:var(--g2);font-weight:700;opacity:1}
.nbtn{font-size:11.5px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--y);color:#3a2a00;white-space:nowrap;font-family:inherit}
.nbtn.ghost{background:rgba(255,255,255,.18);color:#fff}
main{max-width:1120px;margin:0 auto;padding:26px 16px 60px;animation:rise .5s both}
h1{font-size:clamp(26px,4vw,40px);margin:0 0 6px;line-height:1.15}h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 6px;font-size:16px}
.sub{color:var(--mute);margin:0 0 22px}
.hero{border-radius:28px;padding:clamp(26px,5vw,60px);color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#0e7c3a,#1faa59 45%,#ffb800);box-shadow:var(--shadow)}
.hero::after,.hero::before{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:float 7s ease-in-out infinite}
.hero::after{width:300px;height:300px;right:-80px;top:-90px}.hero::before{width:160px;height:160px;right:22%;bottom:-70px;animation-delay:-3s}
.hero h1{font-size:clamp(30px,5.5vw,54px);max-width:680px;position:relative;z-index:1}.hero p{max-width:560px;position:relative;z-index:1;font-size:17px}
.row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.btn{border:0;border-radius:14px;padding:11px 20px;font:600 14px Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--g),var(--t));transition:.25s;box-shadow:0 6px 16px rgba(31,170,89,.35)}
.btn:hover{transform:translateY(-3px) scale(1.03)}.btn.y{background:var(--y);color:#3a2a00;box-shadow:0 6px 16px rgba(255,184,0,.4)}.btn.o{background:linear-gradient(135deg,var(--o),#ff3d6e)}.btn.w{background:#fff;color:var(--g2)}.btn.s{padding:7px 13px;font-size:12.5px;border-radius:10px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn svg{width:18px;height:18px;flex:none}.btn.s svg{width:15px;height:15px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:.3s}
.card:hover{transform:translateY(-4px)}
.sec{margin-top:42px}
.stat{color:#fff;border:0;position:relative;overflow:hidden}.stat b{font-size:32px;display:block;line-height:1.1}.stat small{opacity:.9}
.c1{background:linear-gradient(135deg,#1faa59,#0e7c3a)}.c2{background:linear-gradient(135deg,#ffb800,#ff7a2f)}.c3{background:linear-gradient(135deg,#00a6a6,#2c6bff)}.c4{background:linear-gradient(135deg,#7a4cff,#ff3d6e)}
.ico{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;margin-bottom:10px;background:rgba(31,170,89,.12);color:var(--g2);flex:none}.ico svg{width:26px;height:26px}.ico.sm{width:40px;height:40px;border-radius:12px;margin:0}.ico.sm svg{width:22px;height:22px}.ico.lg{width:60px;height:60px;border-radius:18px;margin:0}.ico.lg svg{width:34px;height:34px}.stat .ico{background:rgba(255,255,255,.2);color:#fff}.hd{display:flex;align-items:center;gap:10px}.hd .ico{width:36px;height:36px;border-radius:11px;margin:0}.hd .ico svg{width:20px;height:20px}h1 .hd .ico{width:48px;height:48px;border-radius:14px}h1 .hd .ico svg{width:28px;height:28px}.big{display:grid;place-items:center;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.18)}.big svg{width:42px;height:42px}.drop .ico{display:grid;margin:0 auto 10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.ok{background:#d9f7e4;color:#0b7a37}.wait{background:#fff0c2;color:#8a5b00}.bad{background:#ffe0e0;color:#b4232c}.info{background:#e1ecff;color:#2450b8}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:9px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ring{position:relative;display:grid;place-items:center}.ring span{position:absolute;font-size:30px;font-weight:800}.ring svg{transform:rotate(-90deg)}.ring circle{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
form{display:grid;gap:12px}label{font-size:12.5px;font-weight:600;color:var(--mute);display:grid;gap:4px}
input,select,textarea{font:14px Poppins,sans-serif;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:0;transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(31,170,89,.18)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.auth{display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.auth aside{padding:36px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px}.auth section{padding:32px}
.fa{background:linear-gradient(160deg,#0e7c3a,#1faa59,#ffb800)}.ia{background:linear-gradient(160deg,#2c1d8a,#7a4cff,#00a6a6)}
@media(max-width:760px){.auth{grid-template-columns:1fr}}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);animation:rise .5s both}.item:last-child{border:0}.item .grow{flex:1}.item small{color:var(--mute)}
.drop{border:2.5px dashed var(--g);border-radius:20px;padding:30px;text-align:center;background:rgba(31,170,89,.07);cursor:pointer;transition:.3s}.drop:hover{background:rgba(31,170,89,.16);transform:scale(1.01)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:0;border-radius:99px;padding:8px 16px;font:600 13px Poppins;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}.tabs .on{background:linear-gradient(135deg,var(--g),var(--t));color:#fff;border:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}th{background:linear-gradient(90deg,#1faa59,#00a6a6);color:#fff}
.rev{opacity:0;transform:translateY(30px);transition:.7s}.rev.in{opacity:1;transform:none}
.price{text-align:center}.price b{font-size:28px;display:block;color:var(--g2)}.price.hot{background:linear-gradient(160deg,#fff7d6,#ffe19a);color:#3a2a00}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17321f;color:#fff;padding:12px 22px;border-radius:99px;z-index:90;animation:rise .4s both;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}.toast svg{width:18px;height:18px;color:#7ee2a2;flex:none}
.step{counter-increment:s}.step::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--y);color:#3a2a00;font-weight:800;margin-bottom:8px}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:24px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-22px)}}@keyframes sway{50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function useCount(to,ms=1200){const[v,setV]=useState(0);useEffect(()=>{let st=null,id;const f=t=>{st=st||t;const p=Math.min((t-st)/ms,1);setV(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)},[to]);return v}
function Count({to,suf=""}){return html`${useCount(to)}${suf}`}
function Rev({children,cls="",d=0}){const r=useRef();const[on,setOn]=useState(false);useEffect(()=>{const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){setOn(true);o.disconnect()}},{threshold:.15});o.observe(r.current);return()=>o.disconnect()},[]);return html`<div ref=${r} class=${"rev "+cls+(on?" in":"")} style=${{transitionDelay:d+"ms"}}>${children}</div>`}
function Ring({v,size=150,c="#1faa59"}){const[x,setX]=useState(0);useEffect(()=>{const t=setTimeout(()=>setX(v),150);return()=>clearTimeout(t)},[v]);const r=size/2-10,C=2*Math.PI*r;return html`<div class="ring" style=${{width:size,height:size}}><svg width=${size} height=${size}><circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="#dcebd9" stroke-width="12"/><circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke=${c} stroke-width="12" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C*(1-x/100)}/></svg><span><${Count} to=${v}/></span></div>`}
function Bar({label,v,c}){const[x,setX]=useState(0);useEffect(()=>{const t=setTimeout(()=>setX(v),200);return()=>clearTimeout(t)},[v]);return html`<div><small><b>${label}</b> · ${v}/100</small><div class="bar"><i style=${{width:x+"%",background:c}}/></div></div>`}
function Tag({k,children}){return html`<span class=${"tag "+k}>${children}</span>`}
function F({label,type="text",ph,opts,v}){return html`<label>${label}${opts?html`<select>${opts.map(o=>html`<option>${o}</option>`)}</select>`:type==="area"?html`<textarea rows="3" placeholder=${ph}/>`:html`<input type=${type} placeholder=${ph} defaultValue=${v}/>`}</label>`}
function Stat({c,i,n,suf,t}){return html`<div class=${"card stat "+c}><${Ico} n=${i}/><b><${Count} to=${n} suf=${suf}/></b><small>${t}</small></div>`}

<div class="card"><h2>Five-Dimension Scores</h2>${DIMS.map((d,i)=>html`<${Bar} label=${d} v=${[88,80,78,84,80][i]} c=${COL[i]}/>`)}</div></div>
<div class="card sec"><${HI} i="clipboard-text">Readiness Report<//><p>Your business is real, producing and consistent in its financials. Compliance is your weakest area: one certificate is still in review and the bank statements need a fix (upload the last 6 months, stamped by the bank). Every score is linked to an uploaded document.</p><button class="btn y" onClick=${()=>window.print()}>Download report</button></div></div>`}
function FRec(){const L=(t,i,k,a)=>html`<div class="card"><h2>${t}</h2>${a.map(x=>html`<div class="item"><${Ico} n=${i} cls="sm"/><div class="grow">${x}</div><${Tag} k=${k}>${k==="bad"?"Missing":k==="wait"?"Improve":"Tip"}<//></div>`)}</div>`;return html`<div><${Head} t="Recommendations" s="Steps to raise your readiness score."/><div class="grid">${L("Improvement Recommendations","lightbulb","info",["Add 12 months of sales records","Add customer contracts","Add insurance details"])}${L("Missing Documents","paperclip","bad",["Valid bank statements","Export licence","Land ownership deed"])}${L("Areas to Improve","chart-bar","wait",["Documentation & compliance (78)","Risk & sustainability (80)","Financial readiness (80)"])}</div></div>`}

/* ---------- INVESTOR ---------- */
function IDash({go}){return html`<div><${Head} t="Investment Overview" s="Welcome back, Dilani · Diaspora Agri Impact Fund"/><div class="grid"><${Stat} c="c4" i="coins" n=${35} suf="M" t="LKR committed interest"/><${Stat} c="c1" i="sparkle" n=${12} t="New SMEs this week"/><${Stat} c="c2" i="star" n=${3} t="Shortlisted SMEs"/><${Stat} c="c3" i="handshake" n=${2} t="Active connections"/></div>
<div class="grid g2 sec"><div class="card"><${HI} i="sparkle">New SMEs<//>${SMES.slice(0,3).map(s=>html`<div class="item"><${Ico} n=${s.e} c=${s.k} cls="sm"/><div class="grow"><b>${s.n}</b><br/><small>${s.l} · ${s.t}</small></div><${Tag} k="ok">${s.s}<//></div>`)}<button class="btn s" onClick=${()=>go("i-discover")}>Discover more</button></div><${Notes} items=${[["check-circle","Kurunegala Coconut accepted your request","1 hour ago"],["sparkle","4 new SMEs match your preferences","Today"],["chart-line-up","Rice Mill score updated to 88","Yesterday"]]}/></div></div>`}
function IProfile({say}){return html`<div><${Head} t="Investor Profile" s="Tell us what you look for."/><form onSubmit=${e=>{e.preventDefault();say("Profile saved")}}><div class="grid"><div class="card"><${HI} i="user">Personal Details<//><${F} label="Name" v="Dilani Fernando"/><${F} label="Email" v="dilani@agriimpact.lk"/><${F} label="Phone" v="0112223344"/></div><div class="card"><${HI} i="target">Investment Preferences<//><${F} label="Ticket size" opts=${["LKR 1–5M","LKR 5–20M","LKR 20M+"]}/><${F} label="Minimum readiness score" type="number" v="70"/><${F} label="Preferred districts" opts=${["Western","North Western","Central"]}/></div><div class="card"><${HI} i="plant">Investment Interests<//><${F} label="Sectors" opts=${["Coconut","Spices","Dairy","Poultry","Food processing"]}/><${F} label="Notes" type="area" ph="Export-ready, GAP certified..."/></div></div><br/><button class="btn">Save profile</button></form></div>`}
function IDiscover({go,sel,sl,tog}){const[q,setQ]=useState("");const[ty,setTy]=useState("All");const[mn,setMn]=useState(0);const list=SMES.filter(s=>(ty==="All"||s.t===ty)&&s.s>=mn&&(s.n+s.l).toLowerCase().includes(q.toLowerCase()));return html`<div><${Head} t="Discover SMEs" s="Verified agricultural SMEs above the minimum threshold."/>
<div class="card two" style=${{marginBottom:18}}><label>Search<input placeholder="Name or district" value=${q} onInput=${e=>setQ(e.target.value)}/></label><label>Sector<select value=${ty} onChange=${e=>setTy(e.target.value)}>${["All","Coconut","Spices","Dairy","Poultry","Food processing"].map(o=>html`<option>${o}</option>`)}</select></label><label>Min score: ${mn}<input type="range" min="0" max="90" value=${mn} onInput=${e=>setMn(+e.target.value)}/></label></div>
<div class="grid">${list.map((s,i)=>html`<${Rev} d=${i*70}><div class="card"><div class="row" style=${{justifyContent:"space-between",alignItems:"center"}}><${Ico} n=${s.e} c=${s.k} cls="lg"/><${Ring} v=${s.s} size=${70}/></div><h3>${s.n}</h3><small class="sub">${s.l} · ${s.t}</small><div class="row" style=${{marginTop:10}}><button class="btn s" onClick=${()=>{sel(s.id);go("i-sme")}}>Details</button><button class=${"btn s "+(sl.includes(s.id)?"y":"o")} onClick=${()=>tog(s.id)}><${Icon} n=${sl.includes(s.id)?"star-fill":"star"}/>${sl.includes(s.id)?"Saved":"Shortlist"}</button></div></div><//>`)}</div>${list.length?null:html`<p class="sub">No SMEs match your filters.</p>`}</div>`}
function ISme({id,sl,tog,say}){const s=SMES.find(x=>x.id===id)||SMES[0];const[auth,setAuth]=useState(false);return html`<div><${Head} t=${html`<span class="hd"><${Ico} n=${s.e} c=${s.k}/>${s.n}</span>`} s=${s.l+" · "+s.t}/><div class="grid g2"><div class="card"><h2>Business Information</h2><p>Established agri-SME with consistent sales records and ${[14,9,22,6,31][s.id-1]} employees. Operations verified through uploaded registration and tax documents.</p><div class="row"><button class=${"btn s "+(sl.includes(s.id)?"y":"")} onClick=${()=>tog(s.id)}><${Icon} n=${sl.includes(s.id)?"star-fill":"star"}/>${sl.includes(s.id)?"Shortlisted":"Shortlist"}</button><button class="btn s o" onClick=${()=>say("Connection request sent")}>Request connection</button></div></div>
<div class="card" style=${{textAlign:"center"}}><h2>Readiness Score</h2><div style=${{display:"grid",placeItems:"center"}}><${Ring} v=${s.s} size=${150}/></div></div></div>
<div class="grid g2 sec"><div class="card"><h2>Five Dimensions</h2>${DIMS.map((d,i)=>html`<${Bar} label=${d} v=${s.d[i]} c=${COL[i]}/>`)}</div><div class="card"><${HI} i="lock">Verified Documents<//>${["Business Registration","Tax Records","Sales Records (12 months)"].map(d=>html`<div class="item"><${Ico} n=${auth?"file-text":"lock"} cls="sm"/><div class="grow">${auth?d:"••••••••••••"}</div><${Tag} k="ok">Verified<//></div>`)}<button class="btn s y" onClick=${()=>{setAuth(!auth);say(auth?"Access hidden":"Access granted")}}>${auth?"Hide documents":"Request access (authorized only)"}</button></div></div></div>`}
function IShort({sl,tog,go,sel}){const L=SMES.filter(s=>sl.includes(s.id));return html`<div><${Head} t="Shortlisted SMEs" s="Saved businesses and side-by-side comparison."/>${L.length?html`<div class="grid">${L.map(s=>html`<div class="card"><h3 class="hd"><${Ico} n=${s.e} c=${s.k} cls="sm"/>${s.n}</h3><small class="sub">${s.l} · ${s.t}</small><div class="row"><button class="btn s" onClick=${()=>{sel(s.id);go("i-sme")}}>Details</button><button class="btn s o" onClick=${()=>tog(s.id)}>Remove</button></div></div>`)}</div>
<div class="card sec" style=${{overflowX:"auto"}}><${HI} i="scales">Compare Selected SMEs<//><table><thead><tr><th>Measure</th>${L.map(s=>html`<th>${s.n}</th>`)}</tr></thead><tbody><tr><td><b>Total score</b></td>${L.map(s=>html`<td>${s.s}</td>`)}</tr>${DIMS.map((d,i)=>html`<tr><td>${d}</td>${L.map(s=>html`<td>${s.d[i]}</td>`)}</tr>`)}<tr><td>Location</td>${L.map(s=>html`<td>${s.l}</td>`)}</tr></tbody></table></div>`:html`<div class="card"><p>No shortlisted SMEs yet.</p><button class="btn" onClick=${()=>go("i-discover")}>Discover SMEs</button></div>`}</div>`}

/* ---------- APP ---------- */
function App(){const[route,setRoute]=useState(location.hash.slice(1)||"home");const[sl,setSl]=useState([1,5]);const[sid,setSid]=useState(1);const[toast,setToast]=useState("");
useEffect(()=>{const h=()=>{setRoute(location.hash.slice(1)||"home");window.scrollTo(0,0)};addEventListener("hashchange",h);return()=>removeEventListener("hashchange",h)},[]);
const go=r=>{location.hash=r};const say=m=>{setToast(m);setTimeout(()=>setToast(""),2200)};const tog=id=>setSl(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
const role=route.startsWith("f-")?"f":route.startsWith("i-")?"i":"";const authPage=/register|login/.test(route);const nav=role==="f"?FNAV:role==="i"?INAV:[];
const P={"f-register":html`<${Register} role="f" go=${go} say=${say}/>`,"f-login":html`<${Login} role="f" go=${go} say=${say}/>`,"f-dashboard":html`<${FDash} go=${go}/>`,"f-profile":html`<${FProfile} say=${say}/>`,"f-documents":html`<${FDocs} say=${say}/>`,"f-readiness":html`<${FReady}/>`,"f-recommend":html`<${FRec}/>`,"f-connect":html`<${Conns} role="f" say=${say}/>`,"f-settings":html`<${Settings} say=${say}/>`,
"i-register":html`<${Register} role="i" go=${go} say=${say}/>`,"i-login":html`<${Login} role="i" go=${go} say=${say}/>`,"i-dashboard":html`<${IDash} go=${go}/>`,"i-profile":html`<${IProfile} say=${say}/>`,"i-discover":html`<${IDiscover} go=${go} sel=${setSid} sl=${sl} tog=${tog}/>`,"i-sme":html`<${ISme} id=${sid} sl=${sl} tog=${tog} say=${say}/>`,"i-shortlist":html`<${IShort} sl=${sl} tog=${tog} go=${go} sel=${setSid}/>`,"i-connections":html`<${Conns} role="i" say=${say}/>`,"i-settings":html`<${Settings} say=${say}/>`};
return html`<div><nav><div class="logo" onClick=${()=>go("home")}><i><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M9 24c0-8 6-14 16-15-1 10-7 16-15 16" fill="#0E6B36"/><path d="M10 25c4-5 7-8 12-11" stroke="#F5F8F2" stroke-width="2" fill="none" stroke-linecap="round"/></svg></i>Agri Lanka Trust</div>
<div class="links">${nav.length?nav.map(([r,l])=>html`<a href=${"#"+r} class=${route===r||(r==="i-discover"&&route==="i-sme")?"on":""}>${l}</a>`):html`<a href="#home" class="on">Home</a><a href="#f-login">Farmer Login</a><a href="#i-login">Investor Login</a><a href="#f-register">For Farmers</a><a href="#i-register">For Investors</a><a href="../index.html">Website</a>`}</div>
${role&&!authPage?html`<button class="nbtn ghost" onClick=${()=>go("home")}>Logout</button>`:html`<button class="nbtn ghost" onClick=${()=>go((role||"f")+"-login")}>Login</button><button class="nbtn" onClick=${()=>go((role||"f")+"-register")}>Register</button>`}</nav>
<main key=${route}>${P[route]||html`<${Home} go=${go}/>`}</main><footer>Agri Lanka Trust · Group 137 · SLIIT · Trust first. Capital second. · Prototype with sample data · Icons: Phosphor (MIT) · <a href="../index.html" style=${{color:"var(--g2)",fontWeight:700}}>Back to website</a></footer>${toast?html`<div class="toast"><${Icon} n="check-circle"/>${toast}</div>`:null}</div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
